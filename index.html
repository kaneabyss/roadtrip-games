function balancedQuestion(id,variant){
 const pool=id==='quiz'?quiz:vf, cats=id==='quiz'?quizCategories:vfCategories;
 const levels=id==='quiz'?quizLevels:vfLevels;
 const mode=['enfants','famille','adultes'].includes(cfg.difficulty)?cfg.difficulty:'famille';
 const allowed=mode==='enfants'?[0]:mode==='adultes'?[1,2]:[0,1,2];
 const all=pool.map((_,i)=>i).filter(i=>(variant==='mixte'||cats[i]===variant)&&allowed.includes(levels[i]));
 if(!all.length)return undefined;
 const key='rtg-v07-deck-'+id+'-'+variant+'-'+mode;
 let remaining=[];try{remaining=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(remaining)||remaining.some(i=>!all.includes(i))||new Set(remaining).size!==remaining.length)remaining=[]}catch{}
 if(!remaining.length)remaining=shuffle([...all]);
 let topics=[];try{topics=JSON.parse(localStorage.getItem(key+'-topics')||'[]')}catch{}if(!Array.isArray(topics))topics=[];
 let recentLevels=[];try{recentLevels=JSON.parse(localStorage.getItem(key+'-levels')||'[]')}catch{}if(!Array.isArray(recentLevels))recentLevels=[];
 const recent=topics.slice(-2);
 let candidates=remaining.filter(i=>!recent.includes(contentTopic(id,i)));
 if(!candidates.length)candidates=remaining.filter(i=>contentTopic(id,i)!==topics.at(-1));
 if(!candidates.length)candidates=remaining;
 // Équilibrage des niveaux sur une fenêtre glissante, sans imposer un ordre fixe.
 if(mode!=='enfants'){
  const targets=mode==='famille'?[0.4,0.4,0.2]:[0,0.4,0.6];
  const recentCounts=[0,1,2].map(l=>recentLevels.slice(-9).filter(x=>x===l).length);
  const wanted=[0,1,2].filter(l=>allowed.includes(l)).sort((a,b)=>(targets[b]*10-recentCounts[b])-(targets[a]*10-recentCounts[a]));
  for(const l of wanted){let subset=candidates.filter(i=>levels[i]===l);if(subset.length){candidates=subset;break}}
 }
 const chosen=candidates[Math.floor(Math.random()*candidates.length)];
 remaining.splice(remaining.indexOf(chosen),1);
 topics=[...topics,contentTopic(id,chosen)].slice(-3);
 recentLevels=[...recentLevels,levels[chosen]].slice(-10);
 try{localStorage.setItem(key,JSON.stringify(remaining));localStorage.setItem(key+'-topics',JSON.stringify(topics));localStorage.setItem(key+'-levels',JSON.stringify(recentLevels))}catch{}
 let item=pool[chosen];
 if(id==='quiz'){const perm=shuffle([0,1,2,3]);item=[item[0],perm.map(i=>item[1][i]),perm.indexOf(item[2]),item[3]]}
 return item;
}

function draw(id,count=1,variant=''){let pool=variant&&id==='bingo'?bingoEnvironments[variant]:contentPools[id];let indices=pool.map((_,i)=>i);if((id==='quiz'||id==='vf')&&variant&&variant!=='mixte'){let cats=id==='quiz'?quizCategories:vfCategories;indices=indices.filter(i=>cats[i]===variant)}if(!indices.length)return [];let key='rtg-v03-deck-'+id+'-'+(variant||'all'),deck=[];try{deck=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(deck)||deck.some(i=>!indices.includes(i))||new Set(deck).size!==deck.length)deck=[]}catch{deck=[]}let out=[],last=-1;try{last=Number(localStorage.getItem(key+'-last')||-1)}catch{}while(out.length<Math.min(count,indices.length)){if(!deck.length){deck=shuffle(indices.filter(i=>!out.some(x=>pool[i]===x)));if(deck.length>1&&deck[0]===last){let j=deck.findIndex(i=>i!==last);[deck[0],deck[j]]=[deck[j],deck[0]]}}let i=deck.shift();if(i===undefined)break;out.push(pool[i]);last=i}try{localStorage.setItem(key,JSON.stringify(deck));localStorage.setItem(key+'-last',String(last))}catch{}return out}

 state.variant=options[old.variant]?old.variant:'mixte';state.mode=old.mode||'collectif';state.length=old.length===undefined?10:old.length;state.size=old.size||3;state.subtopic=old.subtopic||'mixte';state.players=(vPlayers||['Joueur 1','Joueur 2']).slice(0,6);state.scores=state.players.map(()=>0);
 const title=isBingo?'🚗 Bingo de la Route':id==='quiz'?'🧠 Quiz en famille':'✅ Vrai ou Faux';
 shell(title,'Configurer la partie',`<p class="muted">${isBingo?'Adapte la grille au paysage du trajet.':'Choisis le thème, le format et les participants.'}</p><div class="setup-group"><h3>${isBingo?'Environnement':'Catégorie'}</h3><div class="setup-options">${Object.entries(options).map(([k,l])=>`<button class="setup-choice ${state.variant===k?'selected':''}" data-variant="${k}">${safe(l)}</button>`).join('')}</div></div>${!isBingo?`<div class="setup-group"><h3>Sous-thème (facultatif)</h3><select id="vSub" class="vSelect"></select><p class="note" id="vSubHint"></p></div><div class="setup-group"><h3>Mode de jeu</h3><div class="setup-options">${[['collectif','👨‍👩‍👧‍👦 Collectif'],['competition','🏆 Compétition']].map(([k,l])=>`<button class="setup-choice ${state.mode===k?'selected':''}" data-mode="${k}">${l}</button>`).join('')}</div></div><div class="setup-group" id="vPlayerGroup"><h3>Joueurs (2 à 6)</h3><div class="player-editor" id="vPlayerInputs"></div><div class="row"><button class="secondary" id="vAdd">+ Ajouter</button><button class="secondary" id="vRemove">− Retirer</button></div></div><div class="setup-group"><h3>Durée de la partie</h3><div class="setup-options">${[[5,'5 questions'],[10,'10 questions'],[20,'20 questions'],[0,'Sans limite']].map(([k,l])=>`<button class="setup-choice ${state.length===k?'selected':''}" data-length="${k}">${l}</button>`).join('')}</div></div>`:`<div class="setup-group"><h3>Taille de la grille</h3><div class="setup-options">${[[3,'3 × 3 · Rapide'],[4,'4 × 4 · Défi']].map(([k,l])=>`<button class="setup-choice ${state.size===k?'selected':''}" data-size="${k}">${l}</button>`).join('')}</div></div>`}<div class="row"><button class="primary" id="vLaunch">${isBingo?'Créer la grille':'Lancer la partie'} →</button></div><p class="note">Le passager seul utilise l'écran. Les jeux locaux ne nécessitent pas de serveur.</p>`);
 main.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{state.variant=b.dataset.variant;vSelected('variant',state.variant);if(!isBingo)vUpdateSub()});
 if(!isBingo){
 const vUpdateSub=()=>{const select=document.getElementById('vSub'),available=topicOptions(id,state.variant);select.innerHTML=`<option value="mixte">Tous les sous-thèmes</option>`+available.map(t=>`<option value="${t}">${safe(subtopics[t])}</option>`).join('');if(!available.includes(state.subtopic))state.subtopic='mixte';select.value=state.subtopic;select.onchange=()=>{state.subtopic=select.value;vSubHint()};vSubHint()};
 const vSubHint=()=>{let hint=document.getElementById('vSubHint');if(!hint)return;let pool=id==='quiz'?quiz:vf,cats=id==='quiz'?quizCategories:vfCategories,levels=id==='quiz'?quizLevels:vfLevels,allowed=cfg.difficulty==='enfants'?[0]:cfg.difficulty==='adultes'?[1,2]:[0,1,2];let n=pool.filter((_,i)=>(state.variant==='mixte'||cats[i]===state.variant)&&(state.subtopic==='mixte'||subtopicFor(id,i)===state.subtopic)&&allowed.includes(levels[i])).length;hint.textContent=n+' questions disponibles pour la difficulté actuelle.'};
 // Les callbacks utilisent les fonctions de cette portée.
 main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;vSelected('mode',state.mode);vShowPlayers()});
 main.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{state.length=+b.dataset.length;vSelected('length',String(state.length))});
 const vShowPlayers=()=>{document.getElementById('vPlayerGroup').classList.toggle('hidden',state.mode!=='competition');document.getElementById('vPlayerInputs').innerHTML=state.players.map((p,i)=>`<input data-player="${i}" aria-label="Nom du joueur ${i+1}" maxlength="22" value="${safe(p)}">`).join('');main.querySelectorAll('[data-player]').forEach(b=>b.oninput=()=>{state.players[+b.dataset.player]=b.value})};
 document.getElementById('vAdd').onclick=()=>{if(state.players.length<6){state.players.push('Joueur '+(state.players.length+1));vShowPlayers()}};
 document.getElementById('vRemove').onclick=()=>{if(state.players.length>2){state.players.pop();vShowPlayers()}};
 vShowPlayers();vUpdateSub();
 }else main.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{state.size=+b.dataset.size;vSelected('size',String(state.size))});
 document.getElementById('vLaunch').onclick=()=>{
  if(!isBingo){state.players=state.players.map((p,i)=>p.trim()||'Joueur '+(i+1));vPlayers=state.players;setStore(V1_PLAYERS,vPlayers);state.scores=state.players.map(()=>0);state.item=vDrawQuestion(id);if(!state.item){alert('Aucune question pour cette combinaison. Choisis un autre sous-thème ou une autre difficulté.');return}}
  else{state.board=draw('bingo',state.size*state.size,state.variant);state.marked=[];state.bingoWon=false}
  setStore('rtg-v1-choice-'+id,{variant:state.variant,mode:state.mode,length:state.length,size:state.size,subtopic:state.subtopic});state.i=0;state.score=0;state.answer=null;state.finished=false;vPersist();renderGame()
 };
};
function vResume(){let saved=getStore(V1_KEY,null);if(!saved||!['quiz','vf','bingo'].includes(saved.page))return;page=saved.page;state=saved.state;if(state.finished){vClear();home();return}renderGame()}
function vAchievements(){let earned=[];if(vStats.games>=1)earned.push('🎲 Première partie');if(vStats.games>=10)earned.push('🧭 10 parties terminées');if(vStats.correct>=10)earned.push('🧠 10 bonnes réponses');if(vStats.correct>=50)earned.push('🏅 50 bonnes réponses');if(vStats.bingos>=1)earned.push('🚗 Premier Bingo');if(vStats.bingos>=5)earned.push('🌟 5 Bingos');if(vStats.achievements.includes('perfect'))earned.push('💯 Partie sans faute');return earned}
function vStatistics(){page='statistics';shell('🏅 Trophées et statistiques','Sur cet appareil',`<div class="stats-grid"><div class="statbox"><strong>${vStats.games}</strong>Parties terminées</div><div class="statbox"><strong>${vStats.correct}</strong>Bonnes réponses</div><div class="statbox"><strong>${vStats.questions}</strong>Questions jouées</div><div class="statbox"><strong>${vStats.bingos}</strong>Bingos réussis</div></div><h3>Récompenses</h3>${vAchievements().length?vAchievements().map(t=>`<div class="achievement">${safe(t)}</div>`).join(''):'<p class="muted">Termine une partie pour débloquer tes premiers trophées !</p>'}<p class="note">Ces statistiques restent dans le navigateur de cet appareil.</p>`)}
home=function(){oldHome();const hero=main.querySelector('.hero');if(hero){let saved=getStore(V1_KEY,null);let box=document.createElement('div');box.className='row';box.style.marginTop='16px';box.innerHTML=`${saved&&['quiz','vf','bingo'].includes(saved.page)?'<button class="primary" id="vResume">▶ Reprendre la partie</button>':''}<button class="secondary" id="vStats">🏅 Mes trophées</button><button class="secondary" id="vFullscreen">⛶ Plein écran</button>`;hero.appendChild(box);const r=document.getElementById('vResume');if(r)r.onclick=vResume;document.getElementById('vStats').onclick=vStatistics;document.getElementById('vFullscreen').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}catch{}}}document.querySelector('.footer').textContent='Version 1.0 • Écran réservé au passager • Ne pas distraire le conducteur'};
settings=function(){oldSettings();let root=document.getElementById('gameContent');if(!root)return;let note=root.querySelector('.note');if(note)note.textContent='Difficulté appliquée au Quiz et au Vrai ou Faux. Les sons et animations peuvent être désactivés. Le minuteur est une préférence conservée mais non activée dans cette version.';let extra=document.createElement('div');extra.innerHTML=`<div class="setting"><label for="vFull">Mode plein écran</label><button class="secondary" id="vFull">⛶ Activer</button></div><div class="setting"><label for="vStatsButton">Statistiques</label><button class="secondary" id="vStatsButton">🏅 Voir les trophées</button></div>`;root.querySelector('.settings').append(...extra.children);document.getElementById('vFull').onclick=()=>{try{document.documentElement.requestFullscreen?.()}catch{}};document.getElementById('vStatsButton').onclick=vStatistics;const anim=document.getElementById('animations');anim.addEventListener('change',()=>document.body.classList.toggle('no-animations',!cfg.animations))};
document.body.classList.toggle('no-animations',!cfg.animations);

document.getElementById('settingsBtn').onclick=settings;home();
</script></body></html>
